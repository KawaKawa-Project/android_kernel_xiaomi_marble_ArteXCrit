name: Build ArteXCrit ReSukiSU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ArteXCrit
    runs-on: ubuntu-24.04

    steps:
      # ==========================================
      # 1. Checkout branch resukisu
      # ==========================================
      - name: Checkout resukisu
        uses: actions/checkout@v4
        with:
          repository: KawaKawa-Project/android_kernel_xiaomi_marble_ArteXCrit
          ref: ArteXCrit
          fetch-depth: 1

      # ==========================================
      # 2. Install dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            python3 \
            python3-pip \
            rsync \
            unzip \
            zip

      # ==========================================
      # 3. Prepare LLVM 23.1.0
      # ==========================================
      - name: Setup LLVM 23.1.0
        run: |
          mkdir -p "$HOME/build_toolchain"

          cd "$HOME/build_toolchain"

          curl -L \
            -o llvm.tar.xz \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.0/LLVM-23.1.0-Linux-X86.tar.xz

          tar -xf llvm.tar.xz

          mv LLVM-23.1.0-Linux-X86 llvm-23.1.0-x86_64

          rm -f llvm.tar.xz

          echo "$HOME/build_toolchain/llvm-23.1.0-x86_64/bin" >> "$GITHUB_PATH"

      # ==========================================
      # 4. Check toolchain
      # ==========================================
      - name: Check LLVM
        run: |
          clang --version
          ld.lld --version
          llvm-ar --version

      # ==========================================
      # 5. Make build script executable
      # ==========================================
      - name: Prepare build script
        run: |
          chmod +x build_ArteXCrit_resukisu.sh

      # ==========================================
      # 6. Build kernel
      # ==========================================
      - name: Build ArteXCrit
        run: |
          ./build_ArteXCrit_resukisu.sh

      # ==========================================
      # 7. Show build result
      # ==========================================
      - name: Check build output
        run: |
          echo "===== BUILD OUTPUT ====="

          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            -exec ls -lh {} \;

      # ==========================================
      # 8. Upload kernel artifact
      # ==========================================
      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: ArteXCrit-Image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.lz4
          if-no-files-found: warn
          compression-level: 0
